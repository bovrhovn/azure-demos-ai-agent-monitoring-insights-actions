name: Build and test
on:
  push:
    paths: ['src/**', 'scripts/**', 'containers/**', 'azure/**', '.github/workflows/build-and-test.yml']
  pull_request:
    paths: ['src/**', 'scripts/**', 'containers/**', 'azure/**', '.github/workflows/build-and-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: src/global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/AgentOps.Web/package-lock.json
      - name: Build browser and run application tests
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Install browser
        shell: pwsh
        run: ./src/tests/AgentOps.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Check browser behavior
        shell: pwsh
        env:
          AGENTOPS_BROWSER_TESTS: 'true'
        run: dotnet test src/AgentOps.slnx --configuration Release --no-build --filter TestCategory=Browser
      - name: Compile Bicep and test deployment orchestration
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -GE ([version]'5.7.1'))) {
            Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -Repository PSGallery
          }
          Import-Module Pester -MinimumVersion 5.7.1
          Invoke-Pester -Path ./azure/tests,./scripts/tests -CI -Output Detailed
